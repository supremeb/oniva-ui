name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gen:index
      - name: Generated index is committed
        run: git diff --exit-code packages/oniva-ui/src/index.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: e2e (base /, reuses the docs build from `npm run build`)
        run: npm run e2e
        env:
          E2E_REUSE_BUILD: '1'
      - name: Rebuild docs at GitHub Pages base path
        run: npm run build -w @oniva-ui/docs
        env:
          BASE_PATH: /oniva-ui/
      - name: e2e at GitHub Pages base path
        run: npm run e2e
        env:
          BASE_PATH: /oniva-ui/
          E2E_REUSE_BUILD: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
